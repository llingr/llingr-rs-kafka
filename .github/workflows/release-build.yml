name: Release build

# Trusted builder (SLSA Build L3): builds and signs the release assets.
# Signing permissions, no contents:write. Verify with:
#   gh attestation verify <asset> --repo llingr/llingr-rs-kafka \
#     --signer-workflow llingr/llingr-rs-kafka/.github/workflows/release-build.yml

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build & attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Licences: syft reads them from the Go module cache, or the proxy. File
    # components are dropped, being named by absolute runner path.
    env:
      SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: 'true'
      SYFT_GOLANG_SEARCH_REMOTE_LICENSES: 'true'
      SYFT_FILE_METADATA_SELECTION: none
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # cargo package runs a verification build, which compiles the Go bridge.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: bridge/go.sum

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-15
        with:
          toolchain: stable

      - name: Check crate version matches tag
        run: |
          # pkgid yields "...#name@x.y.z" or "...#x.y.z"; the cuts handle both.
          crate_version=$(cargo pkgid | cut -d'#' -f2 | cut -d'@' -f2)
          test "v${crate_version}" = "${GITHUB_REF_NAME}" || {
            echo "crate version ${crate_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          }

      # Byte-identical to what cargo publish uploads. Packaged first: cargo
      # refuses a dirty tree, and later steps write to the repository root.
      - name: Package crate
        run: |
          cargo package --locked
          cp target/package/llingr-kafka-*.crate .

      - name: Source archive
        run: >
          git archive --format=tar.gz
          --prefix="llingr-rs-kafka-${GITHUB_REF_NAME}/"
          -o "llingr-rs-kafka-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_REF_NAME}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The working tree also holds the e2e harness, abi-check and docs
      # lockfiles, none of which ship. The crate includes both dependency graphs.
      - name: Unpack the crate for scanning
        run: |
          mkdir -p sbom-src
          tar -xzf llingr-kafka-*.crate -C sbom-src

      - name: Generate CycloneDX SBOM (syft)
        run: >
          syft dir:sbom-src
          --source-name llingr-rs-kafka
          --source-version "${GITHUB_REF_NAME}"
          --source-supplier "Llingr Software Ltd"
          -o "cyclonedx-json=llingr-rs-kafka-${GITHUB_REF_NAME}.cdx.json"

      - name: Generate SPDX SBOM (syft)
        run: >
          syft dir:sbom-src
          --source-name llingr-rs-kafka
          --source-version "${GITHUB_REF_NAME}"
          --source-supplier "Llingr Software Ltd"
          -o "spdx-json=llingr-rs-kafka-${GITHUB_REF_NAME}.spdx.json"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            llingr-rs-kafka-${{ github.ref_name }}.tar.gz
            llingr-kafka-*.crate

      # Also in GitHub's attestation store; this puts it beside the tarball.
      - name: Attach provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" "llingr-rs-kafka-${GITHUB_REF_NAME}.tar.gz.sigstore"

      # Bound to the .crate: the artifact the SBOM describes.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: llingr-kafka-*.crate
          sbom-path: llingr-rs-kafka-${{ github.ref_name }}.cdx.json

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            llingr-rs-kafka-${{ github.ref_name }}.*
            llingr-kafka-*.crate
          if-no-files-found: error
          retention-days: 1

  engines:
    # One archive per platform, both link modes, for LLINGR_LIB_DIR consumers.
    name: engine ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    # manylinux_2_28 pins the Linux glibc floor at 2.28.
    container: ${{ matrix.container }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Licences: build info includes versions only, so syft reads them from the
    # Go module cache, or the proxy. File components are dropped, being named
    # by absolute runner path.
    env:
      SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: 'true'
      SYFT_GOLANG_SEARCH_REMOTE_LICENSES: 'true'
      SYFT_FILE_METADATA_SELECTION: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            libext: so
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            libext: so
          - triple: aarch64-apple-darwin
            runner: macos-15
            libext: dylib
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
            libext: dylib
    steps:
      # The image's git refuses a repo owned by another uid.
      - name: Trust the workspace
        if: matrix.container != ''
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: bridge/go.sum

      # Native builds: a mismatched runner would mislabel the archive.
      - name: Check the runner matches the target triple
        run: |
          case "$(uname -sm)" in
            "Linux x86_64")  host=x86_64-unknown-linux-gnu ;;
            "Linux aarch64") host=aarch64-unknown-linux-gnu ;;
            "Darwin arm64")  host=aarch64-apple-darwin ;;
            "Darwin x86_64") host=x86_64-apple-darwin ;;
            *) echo "unrecognised host $(uname -sm)"; exit 1 ;;
          esac
          test "${host}" = "${{ matrix.triple }}" || {
            echo "runner host ${host} is not ${{ matrix.triple }}"
            exit 1
          }

      # MODE=native builds here rather than in the docker builder. Passing
      # TARGET_TRIPLE keeps the requirement to Go and a C compiler.
      - name: Build both link modes
        run: |
          make engine MODE=native LINK=static TARGET_TRIPLE=${{ matrix.triple }}
          make engine MODE=native LINK=shared TARGET_TRIPLE=${{ matrix.triple }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The library's own build info lists the modules linked in. One Go build
      # backs both link modes.
      - name: Generate engine SBOM (syft)
        run: >
          syft file:dist/${{ matrix.triple }}/libllingr.${{ matrix.libext }}
          --source-name llingr-engine
          --source-version "${GITHUB_REF_NAME#v}"
          --source-supplier "Llingr Software Ltd"
          -o "cyclonedx-json=llingr-engine.cdx.json"

      # franz-go's BSD-3-Clause requires the notices to ship with the binary.
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="llingr-engine-${version}-${{ matrix.triple }}"
          mkdir "${dir}"
          cp dist/${{ matrix.triple }}/libllingr.* "${dir}/"
          cp LICENSE THIRD-PARTY-NOTICES llingr-engine.cdx.json "${dir}/"
          tar -czf "${dir}.tar.gz" "${dir}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: llingr-engine-*-${{ matrix.triple }}.tar.gz

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: llingr-engine-*-${{ matrix.triple }}.tar.gz
          sbom-path: llingr-engine.cdx.json

      # One artifact name per leg: upload-artifact rejects repeated names.
      - name: Upload engine archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.triple }}
          path: llingr-engine-*-${{ matrix.triple }}.tar.gz
          if-no-files-found: error
          retention-days: 1
